<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 - Page Not Found | Stackly</title>
<link href="styles.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
        body, html {
            margin: 0;
            padding: 0;
            background: #04091A;
        }

        .error-page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #091336 0%, #04091A 100%);
            color: #FFFFFF;
            overflow: hidden;
            position: relative;
            font-family: 'Inter', sans-serif;
        }

        .error-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            z-index: 2;
        }

        .error-code {
            font-size: clamp(100px, 15vw, 180px);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(59, 130, 246, 0.3));
            animation: errorFloat 4s ease-in-out infinite;
        }

        @keyframes errorFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .error-title {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 600;
            margin: 20px 0 10px;
            letter-spacing: -0.02em;
            opacity: 0;
            animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
        }

        .error-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.68);
            max-width: 400px;
            margin: 0 auto 40px;
            opacity: 0;
            line-height: 1.6;
            animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.45s;
        }

        @keyframes fadeUpIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Route Animation */
        .route-wrapper {
            margin-top: 40px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.6s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .route-svg {
            width: 280px;
            height: 30px;
            overflow: visible;
        }

        .route-node {
            fill: #0F172A;
            stroke: #3B82F6;
            stroke-width: 3;
            transition: all 0.3s ease;
        }

        .route-node.broken {
            stroke: #EF4444;
            fill: rgba(239, 68, 68, 0.2);
            animation: pulseRed 2s infinite;
        }

        .route-line {
            stroke: #3B82F6;
            stroke-width: 2;
            stroke-dasharray: 6 6;
            animation: dashMove 1s linear infinite;
        }

        .route-line.broken {
            stroke: rgba(255, 255, 255, 0.2);
            animation: none;
        }
        
        .route-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #3B82F6;
            font-weight: 600;
        }

        @keyframes dashMove {
            to { stroke-dashoffset: -12; }
        }

        @keyframes pulseRed {
            0% { stroke-width: 3; filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0.8)); }
            50% { stroke-width: 5; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); }
            100% { stroke-width: 3; filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0)); }
        }

        .error-actions {
            display: flex;
            gap: 16px;
            opacity: 0;
            animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.75s;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="error-page-wrapper">
<!-- Simple Navbar -->
<header style="position: absolute; top: 0; left: 0; width: 100%; padding: 24px 48px; display: flex; box-sizing: border-box;">
<a class="logo" href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px; opacity: 0; animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
<img alt="Stackly" src="logo.webp" style="height: 32px; width: auto;"/>
</a>
</header>
<div class="error-content">
<h1 class="error-code">404</h1>
<div class="route-wrapper">
<svg class="route-svg" viewbox="0 0 280 20">
<!-- Start Node -->
<circle class="route-node" cx="10" cy="10" r="6"></circle>
<!-- Connecting line -->
<line class="route-line" x1="16" x2="134" y1="10" y2="10"></line>
<!-- Broken Node / X -->
<circle class="route-node broken" cx="140" cy="10" r="6"></circle>
<!-- Faded broken line -->
<line class="route-line broken" x1="146" x2="264" y1="10" y2="10"></line>
<!-- End Node (unreached) -->
<circle class="route-node" cx="270" cy="10" r="6" style="stroke: rgba(255,255,255,0.2);"></circle>
</svg>
<div class="route-label">Procurement Route Disconnected</div>
</div>
<h2 class="error-title">Something went off track.</h2>
<p class="error-desc">The page you're looking for couldn't be found.</p>
<div class="error-actions">
<a class="cta-primary-btn" href="index.html" style="text-decoration: none;">
<span class="btn-text">Back to Home</span>
<span class="btn-arrow" style="margin-left: 8px;">â†’</span>
</a>
<button class="btn-secondary" onclick="window.history.back()" style="font-family: inherit; cursor: pointer; background: rgba(255, 255, 255, 0.05); color: white;">
                    Go Back
                </button>
</div>
</div>
<footer style="position: relative; z-index: 2; padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;">
<img alt="Stackly" src="logo.webp" style="height: 24px; width: auto; opacity: 0.6;"/>
<span style="font-size: 13px; color: rgba(255,255,255,0.4);">Â© 2026 Stackly. All rights reserved.</span>
</div>
<div style="display: flex; gap: 20px;">
<a href="index.html" style="font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: none;">Home</a>
<a href="login.html" style="font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: none;">Login</a>
<a href="#" style="font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: none;">Support</a>
</div>
</footer>
</div>
</body>
</html>
